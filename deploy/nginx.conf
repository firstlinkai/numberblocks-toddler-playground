# Cache policy is the whole point of this file.
#
#   /assets/*  Vite writes content-hashed filenames, so these can never go
#              stale - cache them for a year and immutable.
#   /audio/*   Filenames are NOT hashed (SoundManager fetches by phrase id),
#              so a long cache would pin a re-cut voice line for a year. A
#              week is long enough to matter and short enough to recover from.
#   index.html
#   sw.js      Must never be cached. The service worker is what updates
#   manifest   everything else; cache it and an installed iPad is frozen on
#              whatever it first downloaded.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Traefik terminates TLS and sets X-Forwarded-*; log the real client.
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;
    # WAV is PCM and compresses well (~30%), unlike mp3/ogg.
    gzip_types audio/wav audio/x-wav;

    # The build carries personal audio. Keep it out of search results - this is
    # a family game on a guessable subdomain, not a public product.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location /audio/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location /icons/ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # An installed PWA updates through these three. Never cache them.
    location = /sw.js            { add_header Cache-Control "no-store" always; }
    location = /index.html       { add_header Cache-Control "no-store" always; }
    location = /manifest.json    { add_header Cache-Control "no-store" always; }

    # Single page app: everything else falls back to the shell.
    location / {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri $uri/ /index.html;
    }
}
